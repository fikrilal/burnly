<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <script>
      // Apply the persisted/default theme before first paint to avoid a flash.
      // Keep the storage key and default in sync with src/lib/theme/theme.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem("burnly.theme");
          var choice =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "dark";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var resolved =
            choice === "system" ? (prefersDark ? "dark" : "light") : choice;
          document.documentElement.classList.toggle(
            "dark",
            resolved === "dark",
          );
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
        if (window.location.hash === "#/tray") {
          document.documentElement.classList.add("tray-window");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
