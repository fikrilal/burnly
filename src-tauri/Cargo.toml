[package]
name = "burnly"
version = "0.1.13"
description = "Local desktop app for AI coding-tool token usage."
authors = ["Burnly contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "burnly_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` enables the transparent, decoration-free tray panel on
# macOS; it is a no-op on Linux and Windows.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
thiserror = "=2.0.18"
iana-time-zone = "=0.1.65"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "=0.10.4"
uuid = { version = "=1.23.3", features = ["v4"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-dialog = "=2.3.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.10.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
