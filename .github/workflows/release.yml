name: Release Artifacts

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to validate or publish
        required: false
        type: string
      publish:
        description: Publish a draft GitHub release after every build succeeds
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag || 'dry-run' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      PUBLISH: ${{ inputs.publish || false }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        shell: bash
        run: |
          if [[ "$PUBLISH" == "true" && -z "$RELEASE_TAG" ]]; then
            echo "A release_tag is required for manual publication."
            exit 1
          fi
          pnpm release:version "$RELEASE_TAG"
      - run: pnpm verify

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: release-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: release-macos-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact: release-windows-aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: release-windows-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: release-linux-aarch64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: release-linux-x86_64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm packaging:check
      - name: Build unsigned bundle
        env:
          BURNLY_SIDECAR_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Stage canonical artifact and checksum manifest
        run: pnpm release:stage ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: src-tauri/target/release-artifacts/burnly-*

  publish:
    needs:
      - validate
      - build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - run: pnpm release:verify artifacts
      - name: Publish complete draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --draft \
            --verify-tag \
            --title "Burnly $RELEASE_TAG" \
            --notes "Unsigned release-candidate artifacts with SHA-256 manifests and GitHub build provenance."
